[project]
name = "clipforage"
dynamic = ["version"]
description = "Editing resource finder: green-screen meme clips, images, GIFs, stickers, SFX and music with license info per result."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ry Christofer" }]
requires-python = ">=3.12"
keywords = [
    "video-editing",
    "b-roll",
    "memes",
    "green-screen",
    "stock-footage",
    "yt-dlp",
    "creative-commons",
    "sfx",
    "luts",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "yt-dlp[default]>=2026.8.19",
    "pydantic>=2",
    "tomlkit>=0.13",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/Ry0x7/ClipForage-source"
Repository = "https://github.com/Ry0x7/ClipForage-source"
Issues = "https://github.com/Ry0x7/ClipForage-source/issues"

[project.optional-dependencies]
assist = ["anthropic>=1,<2"]

[project.scripts]
clipforage = "clipforage.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "respx>=0.21"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/clipforage/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/clipforage"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real network"]
addopts = "-m 'not live'"
filterwarnings = [
    # starlette's TestClient nags about httpx -> httpx2; third-party, not actionable here.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
